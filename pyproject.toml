[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdplab"
version = "0.1.0"
description = "Planning and reinforcement learning on two small MDPs: a 2014 course project, revisited and extended."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Espericueta" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "nbconvert", "ipykernel"]
deep = ["torch>=2.0"]
dev = ["pytest", "ruff", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdplab = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
